name: PHP checks
on:
  push:
  pull_request:
concurrency:
  group: php-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, zip, sodium
          coverage: none
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: SQLite migration and schema smoke test
        run: php tests/smoke.php
      - name: Verify portable shared-host package structure
        run: |
          set -eu
          package_root="$(mktemp -d)"
          mkdir -p "$package_root/site/post-comment-private" "$package_root/site/public"
          cp -R src database "$package_root/site/post-comment-private/"
          cp -R public/. "$package_root/site/public/"
          PUBLIC_PATH="$package_root/site/public" php -r '\$_SERVER["DOCUMENT_ROOT"]=getenv("PUBLIC_PATH");require getenv("PUBLIC_PATH")."/bootstrap.php";\$found=postCommentRoot();\$expected=realpath(dirname(getenv("PUBLIC_PATH"))."/post-comment-private");if(\$found!==\$expected){fwrite(STDERR,"Private root discovery failed\\n");exit(1);}'
          test ! -e "$package_root/site/public/config.php"
          test ! -e "$package_root/site/public/storage"
          test ! -e "$package_root/site/public/database"
          (cd "$package_root/site" && zip -q -r "$package_root/portable-test.zip" post-comment-private public)
          unzip -t "$package_root/portable-test.zip" >/dev/null
          rm -rf "$package_root"
      - name: HTTP integration test (development server)
        run: |
          php -r '$c=require "config.example.php";$c["session"]["secure_cookie"]=false;$c["installation"]["setup_key"]=str_repeat("a",64);file_put_contents("config.php","<?php return ".var_export($c,true).";");'
          php -S 127.0.0.1:18901 -t public > /tmp/post-comment-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f config.php storage/database.sqlite storage/database.sqlite-journal; cat /tmp/post-comment-php.log' EXIT
          sleep 1
          python3 tests/http_smoke.py
